# yaml-language-server: $schema=./values.schema.json
image:
  # FIXME: we are currently opting in for the simple hosting solution without redis, pg, thus using the non cluster version
  # see https://github.com/Euro-Office/DocumentServer/pkgs/container/documentserver
  repository: ghcr.io/euro-office/documentserver
  # see https://github.com/Euro-Office/DocumentServer/pkgs/container/cluster-docs
  # repository: ghcr.io/euro-office/cluster-doc
  tag: v9.3.4
  pullPolicy: IfNotPresent

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            EXAMPLE_ENABLED: false
            #JWT_SECRET: my_long_jwt_secret_at_least_32_chars
          envFrom:
            - secretRef:
                # should include a key JWT_SECRET: my_long_jwt_secret_at_least_32_chars
                name: jwt-token
                expandObjectName: false
          probes:
            # see https://github.com/Euro-Office/Kubernetes-Docs/blob/main/values.yaml#L697
            liveness:
              type: http
              port: 8000
              path: /index.html
            readiness:
              type: http
              port: 8000
              path: /index.html
              timeoutSeconds: 3
              successThreshold: 1
              failureThreshold: 2
            startup:
              type: http
              port: 8000
              path: /index.html
              periodSeconds: 10

service:
  main:
    ports:
      main:
        port: 80

# see https://github.com/Euro-Office/Kubernetes-Docs/blob/main/templates/deployments/docservice.yaml#L357
persistence:
  data:
    enabled: true
    mountPath: /var/www/euro-office/Data
  plugins:
    enabled: true
    mountPath: /var/www/euro-office/documentserver/sdkjs-plugins
  cache:
    enabled: true
    mountPath: /var/lib/euro-office/documentserver/App_Data/cache/files

metrics:
  main:
    enabled: false

cnpg:
  main:
    enabled: false

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    # FIXME: should we switch to cluster:docs - the k8s centric image, we need to activate this
#    runAsNonRoot: true
#    runAsUser: 101
#    runAsGroup: 101
